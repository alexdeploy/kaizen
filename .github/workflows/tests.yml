name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Optional in the harness, but there is no reason to skip it in CI.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run validation harness
        run: ./tests/run.sh

# The live evals (tests/run.sh --live) are deliberately not run here: they spawn
# real Claude Code sessions and cost tokens. Run them locally before a release.
